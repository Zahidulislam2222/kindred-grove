# Gitleaks configuration: inherit the built-in detector rules and ignore only
# private root credential files. Project source, docs, tests and the safe
# `.env.example` stay in scope. Gitleaks' inherited default file exclusions
# (including dependency lockfiles and binaries) remain in effect.

[extend]
useDefault = true

[[allowlists]]
description = "Ignore only exact root-level private credential files"
paths = [
  '''^\.env$''',
  '''^\.env\.local$''',
  '''^\.env\.[^/]+\.local$''',
  '''^CREDENTIALS\.md$''',
]
