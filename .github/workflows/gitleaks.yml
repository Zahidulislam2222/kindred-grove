name: Gitleaks

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read pinned toolchain
        id: toolchain
        run: node scripts/ci/toolchain.cjs >> "$GITHUB_OUTPUT"

      - name: Download and verify Gitleaks
        env:
          GITLEAKS_VERSION: ${{ steps.toolchain.outputs.gitleaks_version }}
          GITLEAKS_SHA256: ${{ steps.toolchain.outputs.gitleaks_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan all Git history
        run: >-
          "$RUNNER_TEMP/gitleaks" git
          --config .gitleaks.toml
          --redact=100
          --no-banner
          --no-color
