name: Theme Check

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-check:
    name: Liquid linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned toolchain
        id: toolchain
        run: node scripts/ci/toolchain.cjs >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      - name: Install pinned Shopify CLI
        env:
          SHOPIFY_CLI_VERSION: ${{ steps.toolchain.outputs.shopify_cli }}
        run: npm install --global "@shopify/cli@${SHOPIFY_CLI_VERSION}" --no-audit --no-fund

      - name: Run theme-check
        run: shopify theme check --fail-level=error
