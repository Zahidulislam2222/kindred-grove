name: Lighthouse CI (manual/optional)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Shopify Lighthouse audit (manual/optional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight required Shopify configuration
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_THEME_ID_DEV: ${{ secrets.SHOPIFY_THEME_ID_DEV }}
        run: node scripts/ci/require-env.cjs SHOPIFY_STORE SHOPIFY_CLIENT_ID SHOPIFY_CLIENT_SECRET SHOPIFY_THEME_ID_DEV

      - name: Run Shopify Lighthouse CI
        uses: shopify/lighthouse-ci-action@988f0eeb44ad5f298bd47150e5b9b01c27ead975 # v1
        with:
          store: ${{ secrets.SHOPIFY_STORE }}
          client_id: ${{ secrets.SHOPIFY_CLIENT_ID }}
          client_secret: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          password: ${{ secrets.SHOPIFY_STORE_PASSWORD }}
          pull_theme: ${{ secrets.SHOPIFY_THEME_ID_DEV }}
          lhci_min_score_performance: '0.9'
          lhci_min_score_accessibility: '0.95'
