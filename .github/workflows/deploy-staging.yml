name: Staging theme release gate

on:
  workflow_dispatch:
    inputs:
      target:
        description: Explicit target for a future reviewed deployment
        required: true
        type: choice
        options: [staging-theme]

permissions:
  contents: read

concurrency:
  group: staging-release-gate
  cancel-in-progress: false

jobs:
  verify:
    name: Staging theme verification (writes disabled)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight required deployment configuration
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_THEME_ID_STAGING: ${{ secrets.SHOPIFY_THEME_ID_STAGING }}
        run: node scripts/ci/require-env.cjs SHOPIFY_CLI_THEME_TOKEN SHOPIFY_STORE SHOPIFY_THEME_ID_STAGING

      - name: Read pinned toolchain
        id: toolchain
        run: node scripts/ci/toolchain.cjs >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      - name: Download and verify Gitleaks
        env:
          GITLEAKS_VERSION: ${{ steps.toolchain.outputs.gitleaks_version }}
          GITLEAKS_SHA256: ${{ steps.toolchain.outputs.gitleaks_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Run offline regression tests
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: node --test tests/security/*.test.cjs

      - name: Install pinned Shopify CLI
        env:
          SHOPIFY_CLI_VERSION: ${{ steps.toolchain.outputs.shopify_cli }}
        run: npm install --global "@shopify/cli@${SHOPIFY_CLI_VERSION}" --no-audit --no-fund

      - name: Run theme-check
        run: shopify theme check --fail-level=error

      - name: Block deployment pending remote drift and parity gate
        run: node scripts/ci/block-theme-deploy.cjs
