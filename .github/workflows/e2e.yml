name: E2E — Playwright

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright golden paths (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight required Shopify configuration
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
        run: node scripts/ci/require-env.cjs SHOPIFY_CLI_THEME_TOKEN SHOPIFY_STORE

      - name: Read pinned toolchain
        id: toolchain
        run: node scripts/ci/toolchain.cjs >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm

      - name: Install locked test harness dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install pinned Shopify CLI
        env:
          SHOPIFY_CLI_VERSION: ${{ steps.toolchain.outputs.shopify_cli }}
        run: npm install --global "@shopify/cli@${SHOPIFY_CLI_VERSION}" --no-audit --no-fund

      - name: Push isolated preview theme
        id: push
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE }}
        run: |
          set -euo pipefail
          shopify theme push \
            --unpublished \
            --theme "kg-ci-e2e-${GITHUB_RUN_ID}" \
            --json > "$RUNNER_TEMP/theme-push.json"
          SHOPIFY_STORE="$SHOPIFY_FLAG_STORE" node scripts/ci/read-theme-preview.cjs "$RUNNER_TEMP/theme-push.json" >> "$GITHUB_OUTPUT"

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ steps.push.outputs.base_url }}
          PREVIEW_URL: ${{ steps.push.outputs.preview_url }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_STORE_PASSWORD: ${{ secrets.SHOPIFY_STORE_PASSWORD }}
          CI: 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up preview theme
        if: always() && steps.push.outputs.theme_id != ''
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE }}
          THEME_ID: ${{ steps.push.outputs.theme_id }}
        continue-on-error: true
        run: shopify theme delete --theme "$THEME_ID" --force
